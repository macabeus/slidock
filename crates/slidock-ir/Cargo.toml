[package]
name = "slidock-ir"
description = "slidock presentation IR: types, units, ids, effects vocabulary, diagnostics and verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
# Round-trips and verifies the private fixtures and the recorded IR of the golden files (tests/golden; skips when
# they are absent).
golden = []

[dependencies]
slidock-canon = { workspace = true }
slidock-math = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# Paths of structural errors: the verifier attributes each to its container and node, as zod's issue paths are.
serde_path_to_error = { workspace = true }
# TypeScript declarations of the values the deck format carries (`packages/types`).
ts-rs = { workspace = true, features = ["no-serde-warnings"] }

[[test]]
name = "golden"
required-features = ["golden"]

[[test]]
name = "fixtures"
required-features = ["golden"]

[lints]
workspace = true
