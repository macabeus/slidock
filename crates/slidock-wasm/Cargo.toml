[package]
name = "slidock-wasm"
description = "wasm-bindgen API of slidock for a Web Worker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
slidock = { workspace = true }
slidock-fonts = { workspace = true }
slidock-ir = { workspace = true }
slidock-io = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
js-sys = { workspace = true }
# Prints a panic's message in debug builds only.
console_error_panic_hook = { workspace = true }
# TypeScript declarations of the worker protocol (`packages/types`).
ts-rs = { workspace = true }
wasm-bindgen = { workspace = true }

[dev-dependencies]
# The native tests open IR documents; the wasm build leaves the IR input out (an IR document is refused there).
slidock = { workspace = true, features = ["std-fs", "ir-input"] }
slidock-html = { workspace = true }

[lints]
workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# `pnpm wasm:build` builds with the workspace's `wasm` profile (`--profile wasm`), which wasm-pack reads as `custom`.
# wasm-opt (binaryen 133, -O2, -Os or -Oz) makes the module 11-13 % smaller raw but about 11 % larger with brotli and
# 9 % with gzip, as it ships.
[package.metadata.wasm-pack.profile.custom]
wasm-opt = false
