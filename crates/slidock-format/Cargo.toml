[package]
name = "slidock-format"
description = "slidock deck-format contract: markers, reset rule, paths, lint and compose"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true

[features]
# Composes and lints the document sets of the golden files against the recorded outputs (tests/golden; skips when
# they are absent).
golden = []

[dependencies]
slidock-canon = { workspace = true }
cssparser = { workspace = true }
html5ever = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[[test]]
name = "golden"
required-features = ["golden"]

[lints]
workspace = true
