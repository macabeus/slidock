  message CellRectArchive {
    optional .TSCE.CellCoordinateArchive origin = 1;
    optional .TSCE.ColumnRowSize size = 2;
  }
  message CellCoordinateArchive {
    optional fixed32 packedData = 1;
    optional uint32 column = 2;
    optional uint32 row = 3;
  }
  message ColumnRowSize {
    optional uint32 num_columns = 1;
    optional uint32 num_rows = 2;
  }
}

