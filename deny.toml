# cargo-deny (https://embarkstudios.github.io/cargo-deny/): `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  # cssparser and dtoa-short (linked into both binaries, source on crates.io); slidock-presets and xtask hold
  # LibreOffice-derived MPL-2.0 files of their own.
  "MPL-2.0",
  # Fonts: the bundled substitute faces (slidock-substitutes): Liberation, Carlito and Caladea; DejaVu Sans, under the
  # Bitstream Vera licence (and Arev's, which has no SPDX id and the same terms).
  "OFL-1.1",
  "Bitstream-Vera",
  # webpki-roots (the CA bundle of ureq's rustls, native CLI only).
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
