  message RangeCoordinateArchive {
    optional uint32 top_left_column = 1;
    optional uint32 top_left_row = 2;
    optional uint32 bottom_right_column = 3;
    optional uint32 bottom_right_row = 4;
  }
  message RangeDependenciesTiledArchive {
    repeated .TSP.Reference range_precedents_tile = 1;
