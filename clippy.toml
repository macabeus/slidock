allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true

# Transcendental maths differs between platform libms (and wasm's compiler-builtins). Outputs must be identical on
# every host, so it goes through slidock-math (fdlibm).
disallowed-methods = [
  { path = "f64::sin", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::cos", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::tan", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::sin_cos", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::asin", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::acos", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::atan", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::atan2", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::sinh", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::cosh", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::tanh", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::asinh", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::acosh", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::atanh", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::exp", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::exp2", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::exp_m1", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::ln", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::log", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::log2", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::log10", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::ln_1p", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::powf", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::powi", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::cbrt", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f64::hypot", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::sin", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::cos", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::tan", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::atan2", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::exp", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::ln", reason = "use slidock_math (fdlibm) for deterministic results" },
  { path = "f32::powf", reason = "use slidock_math (fdlibm) for deterministic results" },
]

# HashMap/HashSet iteration order is random per process, and `Instant`/`SystemTime` are a clock (and `Instant::now`
# panics on wasm32-unknown-unknown). Use IndexMap/BTreeMap, and the injected clock.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is random: use IndexMap or BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order is random: use IndexSet or BTreeSet" },
  { path = "std::time::Instant", reason = "no clock in the compiler (panics on wasm): use the injected Clock" },
  { path = "std::time::SystemTime", reason = "no clock in the compiler: use the injected Clock" },
]
