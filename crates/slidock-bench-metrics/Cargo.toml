[package]
name = "slidock-bench-metrics"
description = "slidock fidelity metrics, bit for bit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `HostLibm`: the platform libm, which the pinned numbers come from (bit-identical on macOS arm64).
host-libm = []
# Scores the corpus goldens under $SLIDOCK_PRIVATE/golden/scoring against their recorded scores (skips when they
# are absent).
golden = ["host-libm"]

[dependencies]
slidock-math = { workspace = true }
png = { workspace = true }
unicode-normalization = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true

[package.metadata.golden]
# The scoring suite: about 6 minutes in a debug build, 50 s in release.
release = true
