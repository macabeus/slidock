[package]
name = "xtask"
description = "slidock repository tasks"
version.workspace = true
edition.workspace = true
# Holds MPL-2.0 files derived from LibreOffice (see NOTICE).
license = "MIT AND MPL-2.0"
rust-version.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# Reads the private corpus manifest, which names each corpus deck's files.
serde_json = { workspace = true }
# Checks the pinned LibreOffice sources before they are read.
sha2 = { workspace = true }
# The diagnostic registry `docs/diagnostics.md` is generated from.
slidock-ir = { workspace = true }

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
todo = "deny"
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
