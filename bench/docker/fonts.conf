<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Only the pinned font set (mounted at /fonts) exists for Chromium and poppler. -->
<fontconfig>
  <dir>/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family><family>DejaVu Sans</family><family>Noto Sans Symbols 2</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Liberation Serif</family><family>DejaVu Sans</family><family>Noto Sans Symbols 2</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Liberation Mono</family><family>DejaVu Sans</family><family>Noto Sans Symbols 2</family></prefer>
  </alias>
</fontconfig>
