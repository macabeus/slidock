name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain, the wasm target and the components.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo xtask diagnostics --check
      - run: cargo build --target wasm32-unknown-unknown -p slidock-wasm -p slidock-bench-metrics -p slidock-bench-schema
      - run: cargo deny check
      # The committed probe decks are what their generators write.
      - name: cargo xtask probes-* --check
        run: |
          for probe in callouts gradients grown-text lines motion photos pictures shadows shrink videos; do
            cargo xtask "probes-$probe" --check
          done
      # The crates the CLI builds from package on their own: no file outside its crate, none gitignored.
      - run: >-
          cargo package --locked --no-verify --workspace
          --exclude slidock-wasm --exclude slidock-bench --exclude slidock-bench-metrics --exclude slidock-bench-schema
          --exclude xtask

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: wasm-pack@0.15.0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # THIRD-PARTY-NOTICES.txt lists the crates and the installed web app packages.
      - run: cargo xtask notices --check
      # The player slidock-bundle embeds (crates/slidock-bundle/player/) is the build of packages/player.
      - run: pnpm player:check
      - run: pnpm wasm:build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build
      # The builds leave every committed file as it is.
      - run: git diff --exit-code
