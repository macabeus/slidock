# cargo-fuzz targets for the zip and XML readers, Keynote's IWA framing and protobuf pre-pass, the font container
# decoders, the media decoders, and the whole compile. A workspace of its own, outside the main one: it builds with a nightly toolchain and libFuzzer
# (`cargo +nightly-2026-10-25 fuzz run <target>`, see README.md). `seedgen` writes the generated seeds.
[package]
name = "slidock-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
slidock-fonts = { path = "../crates/slidock-fonts" }
slidock-io = { path = "../crates/slidock-io" }
slidock-fuzz-support = { path = "support" }
slidock-keynote = { path = "../crates/slidock-keynote" }
slidock = { path = "../crates/slidock" }

[workspace]
members = [".", "seedgen", "support"]

[[bin]]
name = "sniff"
path = "fuzz_targets/sniff.rs"
test = false
doc = false
bench = false

