# Builds the CLI for each platform from a `v*` tag, checks it bundles a deck with the real player, and publishes the
# archives (the binary, the licences and the README) with their SHA-256 as the tag's GitHub release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The release binaries carry no symbol table.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          # Ubuntu 22.04's glibc (2.35) is the oldest the Linux binaries run on.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the toolchain.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add "$TARGET"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: The tag names the CLI's version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).packages.find(p=>p.name==="slidock-cli").version))')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the tag $TAG is not slidock-cli's version (v$version)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      # The player the CLI embeds (crates/slidock-bundle/player/) is the build of the tagged sources.
      - run: pnpm player:build
      - run: git diff --exit-code -- crates/slidock-bundle/player
      - run: cargo build --release --locked -p slidock-cli --target "$TARGET"
      - name: Smoke test
        run: |
          bin="target/$TARGET/release/slidock"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          "$bin" compile probes/out/motion-probe.pptx -o smoke.zip --offline
          node .github/scripts/check-deck.mjs smoke.zip
      - name: Archive
        run: |
          name="slidock-$TAG-$TARGET"
          mkdir -p "dist/$name"
          bin="target/$TARGET/release/slidock"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          cp "$bin" LICENSE NOTICE THIRD-PARTY-NOTICES.txt README.md "dist/$name/"
          cp -R LICENSES "dist/$name/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" > /dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"
          rm -r "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slidock-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only this job may write: it creates the release.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: slidock-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}" dist/*
