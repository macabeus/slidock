<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The fonts lane's renderer: /fonts holds only the last-resort face (Unicode's Last Resort High-Efficiency), so every
     glyph a deck's own faces do not draw shows as that face's placeholder and is attributed to the renderer. -->
<fontconfig>
  <dir>/fonts</dir>
  <cachedir>/tmp/fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Last Resort High-Efficiency</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Last Resort High-Efficiency</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Last Resort High-Efficiency</family></prefer>
  </alias>
</fontconfig>
